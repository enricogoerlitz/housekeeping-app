# Secret scan for the check "Geheimnisse" (spec 0014, AC-008): gitleaks' default rules plus our
# own for the keys this project uses. The job runs gitleaks with --redact (file and line, never
# the value) and --ignore-gitleaks-allow over the commits of a pull request, with this file as it
# is on the base branch. Test: scripts/ci/secrets.test.mjs.

title = "housekeeping"

[extend]
useDefault = true

[[rules]]
id = "supabase-secret-key"
description = "Supabase secret key (sb_secret_…)"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

# A JWT whose payload carries "role":"service_role". The payload is base64url, so the claim shows
# up in one of three spellings depending on its byte offset.
[[rules]]
id = "supabase-service-role-jwt"
description = "Supabase JWT with role service_role"
regex = '''eyJ[A-Za-z0-9_-]{8,}\.ey[A-Za-z0-9_-]*(?:InJvbGUiOiJzZXJ2aWNlX3JvbGUi|Jyb2xlIjoic2VydmljZV9yb2xl|icm9sZSI6InNlcnZpY2Vfcm9s)[A-Za-z0-9_-]*\.[A-Za-z0-9_-]{16,}'''
keywords = ["inJvbGUiOiJzZXJ2aWNlX3JvbGUi", "jyb2xlIjoic2VydmljZV9yb2xl", "icm9sZSI6InNlcnZpY2Vfcm9s"]

[[rules]]
id = "azure-storage-account-key"
description = "Azure Storage account key (in a connection string or assigned to a key name)"
regex = '''(?i)(?:AccountKey=|(?:azure|storage|account)[a-z0-9_.-]*key[a-z0-9_.-]*['"]?\s*[:=]\s*['"]?)([A-Za-z0-9+/]{86}==)'''
secretGroup = 1
keywords = ["accountkey", "key"]

[[rules]]
id = "private-key-block"
description = "PEM private key"
regex = '''-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["-----begin"]

# The only allowed match: the public publishable key of the local Supabase CLI stack (identical
# on every machine) in .env.example and the check workflow.
[[allowlists]]
description = "Public local publishable key of the Supabase CLI"
condition = "AND"
paths = ['''^\.env\.example$''', '''^\.github/workflows/checks\.yml$''']
regexTarget = "match"
regexes = ['''sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH''']

# Generated seed ids (UUIDs) trip the generic rule; the file is produced by pnpm db:seed:gen.
[[allowlists]]
description = "Generated seed ids"
condition = "AND"
paths = ['''^e2e/seed-ids\.ts$''']
rules = ["generic-api-key"]

# Published test vectors of RFC 8291 / RFC 8292 (not keys of this project).
[[allowlists]]
description = "RFC 8291/8292 test vectors"
condition = "AND"
paths = ['''^supabase/functions/push-send/web-push\.test\.ts$''']
rules = ["generic-api-key", "jwt"]
