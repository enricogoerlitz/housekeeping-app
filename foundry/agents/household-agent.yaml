              - string
              - 'null'
            enum:
              - area
              - article
              - null
            description: Sortierung
          descending:
            type:
              - boolean
              - 'null'
            description: absteigend sortieren
          limit:
            type:
              - integer
              - 'null'
            description: Einträge je Seite (Standard klein, bis 300 auf ausdrücklichen Wunsch)
            minimum: 1
            maximum: 300
          offset:
            type:
              - integer
              - 'null'
            description: ab Eintrag (0 = Anfang)
            minimum: 0
            maximum: 100000
          fields:
            type:
              - array
              - 'null'
            items:
              type: string
              enum:
