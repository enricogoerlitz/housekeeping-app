            minimum: 1
            maximum: 300
          offset:
            type:
              - integer
              - 'null'
            description: ab Eintrag (0 = Anfang)
            minimum: 0
            maximum: 100000
          fields:
            type:
              - array
              - 'null'
            items:
              type: string
              enum:
