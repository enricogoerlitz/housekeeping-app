          - sort
          - descending
          - limit
          - offset
          - fields
          - kind
          - remembered
          - favorite
          - visited
          - visited_before
        properties:
          query:
            type:
              - string
              - 'null'
            description: Freitext-Suche
          sort:
            type:
              - string
              - 'null'
            enum:
              - name
              - last_visit
              - visits
              - rating
              - created
              - null
            description: Sortierung
          descending:
            type:
              - boolean
              - 'null'
            description: absteigend sortieren
          limit:
            type:
              - integer
              - 'null'
            description: Einträge je Seite (Standard klein, bis 300 auf ausdrücklichen Wunsch)
            minimum: 1
            maximum: 300
          offset:
            type:
              - integer
              - 'null'
            description: ab Eintrag (0 = Anfang)
            minimum: 0
            maximum: 100000
          fields:
            type:
              - array
              - 'null'
            items:
              type: string
              enum:
                - id
                - name
                - kind
                - place_name
                - address
                - description
                - rating
                - favorite_of
                - remembered
                - visits
                - last_visit
                - website
                - maps_url
                - has_photo
            description: Felder der Antwort; nur anfragen, was gebraucht wird
          kind:
            type:
              - string
              - 'null'
            description: Art, z. B. Museum
          remembered:
            type:
              - boolean
              - 'null'
            description: gemerkt („Merken“)
          favorite:
            type:
              - boolean
              - 'null'
            description: Favorit von mindestens einem Mitglied
          visited:
            type:
              - boolean
              - 'null'
            description: schon besucht (stand bis heute im Kalender)
          visited_before:
            type:
              - string
              - 'null'
            description: zuletzt besucht vor diesem Tag oder nie (JJJJ-MM-TT)
    - type: function
      name: calendar
      description:
        'Liest den Kalender eines Zeitraums (höchstens 62 Tage): Einträge je Tag und Tageszeit
        (Rezepte, Restaurants, Aktivitäten auch aus Serien, Freitext, Reste), dazu fällige Aufgaben
        und Reisen.'
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required:
          - from
          - to
          - kinds
          - query
          - sort
          - descending
          - limit
          - offset
          - fields
        properties:
          from:
            type:
              - string
              - 'null'
            description: erster Tag, Pflicht (JJJJ-MM-TT)
          to:
            type:
              - string
              - 'null'
            description: letzter Tag, Pflicht, höchstens 62 Tage (JJJJ-MM-TT)
          kinds:
            type:
              - array
              - 'null'
            items:
              type: string
              enum:
                - recipe
                - restaurant
                - activity
                - text
                - leftovers
            description: nur diese Arten
          query:
            type:
              - string
              - 'null'
            description: Freitext-Suche
          sort:
            type:
              - string
              - 'null'
            enum:
              - date
              - null
            description: Sortierung
          descending:
            type:
              - boolean
              - 'null'
            description: absteigend sortieren
          limit:
            type:
              - integer
              - 'null'
            description: Einträge je Seite (Standard klein, bis 300 auf ausdrücklichen Wunsch)
            minimum: 1
            maximum: 300
          offset:
            type:
              - integer
              - 'null'
            description: ab Eintrag (0 = Anfang)
            minimum: 0
            maximum: 100000
          fields:
            type:
              - array
              - 'null'
            items:
              type: string
              enum:
                - date
                - weekday
                - slot
                - starts_at
                - kind
                - title
                - note
                - guests
                - people
                - not_done
                - series
            description: Felder der Antwort; nur anfragen, was gebraucht wird
    - type: function
      name: shopping_list
      description: Liest die Einkaufsliste (standardmäßig nur Offenes) in Ladenfolge mit Mengen.
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required:
          - query
          - sort
          - descending
          - limit
          - offset
          - fields
          - include_checked
          - area
        properties:
          query:
            type:
              - string
              - 'null'
            description: Freitext-Suche
          sort:
            type:
              - string
              - 'null'
            enum:
              - area
              - article
              - null
            description: Sortierung
          descending:
            type:
              - boolean
              - 'null'
            description: absteigend sortieren
          limit:
            type:
              - integer
              - 'null'
            description: Einträge je Seite (Standard klein, bis 300 auf ausdrücklichen Wunsch)
            minimum: 1
            maximum: 300
          offset:
            type:
              - integer
              - 'null'
            description: ab Eintrag (0 = Anfang)
            minimum: 0
            maximum: 100000
          fields:
            type:
              - array
              - 'null'
            items:
              type: string
              enum:
                - article
                - area
                - amount
                - checked
                - not_available
            description: Felder der Antwort; nur anfragen, was gebraucht wird
          include_checked:
            type:
              - boolean
              - 'null'
            description: auch Abgehaktes (sonst nur Offenes)
          area:
            type:
              - string
              - 'null'
            description: nur dieser Bereich, z. B. Kühlregal
    - type: function
      name: list_recurring_items
      description: Liest die Dauerposten (Artikel, die regelmäßig auf die Liste kommen) mit ihrem Rhythmus.
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required:
          - query
          - sort
          - descending
          - limit
          - offset
          - fields
          - paused
        properties:
