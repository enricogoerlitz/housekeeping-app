              - last_visit
              - visits
              - rating
              - created
              - null
            description: Sortierung
          descending:
            type:
              - boolean
              - 'null'
            description: absteigend sortieren
          limit:
            type:
              - integer
              - 'null'
            description: Einträge je Seite (Standard klein, bis 300 auf ausdrücklichen Wunsch)
            minimum: 1
            maximum: 300
          offset:
            type:
              - integer
              - 'null'
            description: ab Eintrag (0 = Anfang)
            minimum: 0
            maximum: 100000
          fields:
            type:
              - array
              - 'null'
            items:
              type: string
              enum:
                - id
                - name
                - cuisine
                - address
                - price_level
                - tags
                - rating
                - favorite_of
                - visits
                - last_visit
                - website
                - maps_url
                - notes
                - has_photo
            description: Felder der Antwort; nur anfragen, was gebraucht wird
          cuisine:
            type:
              - string
              - 'null'
            description: Küche, z. B. Italienisch
          tags:
            type:
              - array
              - 'null'
            items:
              type: string
            description: Schlagworte, alle müssen passen
          max_price_level:
            type:
              - integer
              - 'null'
            description: höchstens dieses Preisniveau
            minimum: 1
            maximum: 4
          favorite:
            type:
              - boolean
              - 'null'
            description: Favorit von mindestens einem Mitglied
          visited:
            type:
              - boolean
              - 'null'
            description: schon besucht (stand bis heute im Kalender)
          visited_before:
            type:
              - string
              - 'null'
            description: zuletzt besucht vor diesem Tag oder nie (JJJJ-MM-TT)
    - type: function
      name: list_activities
      description:
        Liest die gespeicherten Aktivitäten des Haushalts (Art, gemerkt, Besuche, Favoriten);
        Suche, Filter, Sortierung, Seiten, Felder.
      strict: true
      parameters:
        type: object
