# The one Foundry prompt agent of the household (spec 0067, ADR-0019, ADR-0020): answers everything
# in one conversation, with web search (Web IQ), the cards of `show_suggestions` (parsed by core
# ai-agent.ts) and the household read tools of core agent-tools.ts, which the edge function ai-agent
# runs as the person (RLS). The parameters of those tools are generated from core and checked by
# foundry/src/run.test.ts: change them in packages/core/src/agent-tools.ts, then here. Same keys as
# Foundry's YAML of an agent version; `instructions_file` is ours. Deployed per environment as
# household-agent-local / -preview / -prod by `@housekeeping/foundry`.
name: household-agent
description: 'Housekeeping-Agent: Haushaltsdaten, Websuche, Restaurants und Aktivitäten (Spec 0067)'
metadata:
  app: housekeeping
  spec: '0067'
instructions_file: household-agent.md
definition:
  kind: prompt
  model: gpt-6.1-terra
  reasoning:
    effort: low
  tools:
    - type: web_search
      search_context_size: medium
    - type: function
      name: show_suggestions
      description: >-
        Zeigt vorgeschlagene Restaurants und Aktivitäten als antippbare Karten in der App an. Als
        letzter Schritt aufrufen.
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required: [title, items, follow_ups]
        properties:
          title:
            type: [string, 'null']
            description: Kurzer Titel der Auswahl, z. B. „Samstag in Kreuzberg“
          items:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                [
                  kind,
                  step,
                  name,
                  category,
                  address,
                  district,
                  lat,
                  lng,
                  price_level,
                  price_range,
                  open_status,
                  why,
                  website,
                  tags,
                ]
              properties:
                kind:
                  type: string
                  enum: [restaurant, activity]
                step:
                  type: [string, 'null']
                  description: „erst“, „dann“ … bei Kombinationen, sonst null
                name:
                  type: string
                  description: Name wie auf der eigenen Website
                category:
                  type: string
                  description: Art, z. B. „Italienisch“, „Gourmetrestaurant“, „Museum“
                address:
                  type: [string, 'null']
                  description: Straße Hausnummer, PLZ Ort – nur aus einer Quelle
                district:
                  type: [string, 'null']
                  description: Stadtteil/Kiez
                lat:
                  type: [number, 'null']
                lng:
                  type: [number, 'null']
                price_level:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 4
                price_range:
                  type: [string, 'null']
                  description: z. B. „40–90 € p. P.“ oder „Eintritt 12 €“
                open_status:
                  type: [string, 'null']
                  description: zum gewünschten Zeitpunkt, z. B. „Fr ab 18 Uhr geöffnet“ oder „unsicher“
                why:
                  type: string
                  description: 1–2 Sätze, warum es zur Anfrage passt
                website:
                  type: [string, 'null']
                  description: Eigene Website (https), nur wenn gefunden
                tags:
                  type: array
                  items:
                    type: string
                  description: z. B. Terrasse, vegetarisch
          follow_ups:
            type: array
            items:
              type: string
            description: Bis zu drei kurze Antworten auf deine Rückfrage, z. B. „Eher mit Terrasse“
    - type: function
      name: list_recipes
      description:
        'Liest die Rezepte des Haushalts: Suche, Filter (Gang, Ernährung, Küche, Schlagworte,
        Zeit, zuletzt gekocht, Favorit, unfertig), Sortierung, Seiten mit Gesamtzahl, Felder.'
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required:
          - query
          - sort
          - descending
          - limit
          - offset
          - fields
          - course
          - diet
          - cuisine
          - tags
          - max_minutes
          - cooked_before
          - favorite
          - unfinished
          - include_collections
        properties:
          query:
            type:
              - string
              - 'null'
            description: Freitext-Suche
          sort:
            type:
              - string
              - 'null'
            enum:
              - title
              - last_cooked
              - cooked_count
              - rating
              - total_minutes
              - created
              - null
            description: Sortierung
          descending:
            type:
              - boolean
              - 'null'
            description: absteigend sortieren
          limit:
            type:
              - integer
              - 'null'
            description: Einträge je Seite (Standard klein, bis 300 auf ausdrücklichen Wunsch)
            minimum: 1
            maximum: 300
          offset:
            type:
              - integer
              - 'null'
            description: ab Eintrag (0 = Anfang)
            minimum: 0
            maximum: 100000
          fields:
            type:
              - array
              - 'null'
            items:
              type: string
              enum:
                - id
                - title
                - course
                - cuisine
                - tags
                - diet
                - total_minutes
                - servings
                - last_cooked_on
                - cooked_count
                - rating
                - favorite_of
                - ingredients
                - has_photo
                - unfinished
                - description
            description: Felder der Antwort; nur anfragen, was gebraucht wird
          course:
            type:
              - array
              - 'null'
            items:
              type: string
              enum:
                - breakfast
                - main
                - side
                - dessert
                - snack
                - drink
            description: Gang, einer davon
          diet:
            type:
              - array
              - 'null'
            items:
              type: string
              enum:
                - vegan
                - vegetarian
                - fish
                - meat
                - unknown
            description: Ernährung der Standard-Variante, eine davon; vegetarisch = vegan und vegetarian
          cuisine:
            type:
              - string
              - 'null'
            description: Küche, z. B. Indisch
          tags:
            type:
              - array
              - 'null'
            items:
              type: string
            description: Schlagworte, alle müssen passen
          max_minutes:
            type:
              - integer
              - 'null'
            description: höchstens so viele Minuten
            minimum: 1
            maximum: 10000
          cooked_before:
            type:
              - string
              - 'null'
            description: zuletzt gekocht vor diesem Tag oder nie (JJJJ-MM-TT)
          favorite:
            type:
              - boolean
              - 'null'
            description: Favorit von mindestens einem Mitglied
          unfinished:
            type:
              - boolean
              - 'null'
            description: 'unfertig: ohne Zutaten und ohne Schritte'
          include_collections:
            type:
              - boolean
              - 'null'
            description: auch Sammlungen
    - type: function
      name: list_restaurants
      description:
