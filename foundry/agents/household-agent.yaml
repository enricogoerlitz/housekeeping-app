          cuisine:
            type:
              - string
              - 'null'
            description: Küche, z. B. Italienisch
          tags:
            type:
              - array
              - 'null'
            items:
              type: string
            description: Schlagworte, alle müssen passen
          max_price_level:
            type:
              - integer
              - 'null'
            description: höchstens dieses Preisniveau
            minimum: 1
            maximum: 4
          favorite:
            type:
              - boolean
              - 'null'
            description: Favorit von mindestens einem Mitglied
          visited:
            type:
              - boolean
              - 'null'
            description: schon besucht (stand bis heute im Kalender)
          visited_before:
            type:
              - string
              - 'null'
            description: zuletzt besucht vor diesem Tag oder nie (JJJJ-MM-TT)
    - type: function
      name: list_activities
      description:
        Liest die gespeicherten Aktivitäten des Haushalts (Art, gemerkt, Besuche, Favoriten);
