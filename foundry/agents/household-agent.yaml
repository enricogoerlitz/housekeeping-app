    - type: function
      name: household_values
      description:
        Liefert alle Werte einer Spalte vollständig ohne Seiten, z. B. alle Artikelnamen, alle
        Schlagworte, alle Küchen, alle Räume, die Mitglieder.
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required:
          - column
        properties:
          column:
            type:
              - string
              - 'null'
            enum:
              - article_names
              - recipe_tags
              - recipe_cuisines
              - restaurant_cuisines
              - restaurant_tags
              - activity_kinds
              - areas
              - chore_rooms
              - members
              - null
            description: welche Spalte, vollständig ohne Seiten
    - type: function
      name: propose_actions
      description: 'Schlägt Änderungen vor (Liste, Aufgaben, Kalender, Restaurants, Aktivitäten,
        Merken, Portionen, Dauerposten, Rezepte ausarbeiten, Löschen), auch als Durchgang beim
        Aufräumen. Ändert nichts: die App zeigt eine Karte, die Person übernimmt. Als letzter
        Schritt nach deinem Text.'
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required:
          - title
          - actions
          - more
        properties:
          title:
            type:
              - string
              - 'null'
            description: kurzer Titel der Karte, z. B. „Für heute“
          actions:
            type: array
            description: höchstens 20 Einträge
            items:
              type: object
              additionalProperties: false
              required:
                - kind
                - target
                - id
                - name
                - date
                - slot
                - time
                - address
                - note
                - servings
                - favorite
                - weekday
                - every_weeks
              properties:
                kind:
                  type: string
                  enum:
                    - add_to_list
                    - chore_done
                    - plan
                    - create_restaurant
                    - create_activity
                    - set_favorite
                    - set_servings
                    - add_recurring
                    - set_remembered
                    - work_out
                    - remove_from_list
                    - remove_plan_entry
                    - delete_recurring
                  description:
                    'add_to_list: auf die Einkaufsliste · chore_done: Aufgabe erledigt · plan:
                    Kalender-Eintrag · create_restaurant / create_activity: neu merken ·
                    set_favorite: Herz (Favorit) eines Restaurants oder einer Aktivität ·
                    set_remembered: Aktivität merken (Lesezeichen) oder nicht mehr merken ·
                    set_servings: Portionen eines Rezepts · add_recurring: Dauerposten · work_out:
                    unfertiges Rezept mit KI ausarbeiten · remove_from_list / remove_plan_entry /
                    delete_recurring: löschen, nur auf ausdrücklichen Wunsch'
                target:
                  type:
                    - string
                    - 'null'
                  enum:
                    - recipe
                    - restaurant
                    - activity
                    - text
                    - null
                  description: 'bei plan, set_favorite, set_remembered und work_out: worum es geht'
                id:
                  type:
                    - string
                    - 'null'
                  description: die id aus einem Werkzeug-Ergebnis, sonst null
                name:
                  type: string
                  description:
                    'Liste: Menge und Artikel wie getippt („2 Milch“, „500 g Möhren“); sonst Titel oder
                    Name genau wie in den Daten; bei plan mit target text der Text'
                date:
                  type:
                    - string
                    - 'null'
                  description: Tag JJJJ-MM-TT (plan, remove_plan_entry); null = vorgemerkt
                slot:
                  type:
                    - string
                    - 'null'
                  description: Tageszeit des Haushalts, z. B. Abendessen
                time:
                  type:
                    - string
                    - 'null'
                  description: Uhrzeit HH:MM, nur bei Restaurant und Aktivität
                address:
                  type:
                    - string
                    - 'null'
                  description: Adresse eines neuen Orts, nur aus einer Quelle
                note:
                  type:
                    - string
                    - 'null'
                  description: Zusatz, kurz
                servings:
                  type:
                    - integer
                    - 'null'
                  description: Portionen (set_servings)
                  minimum: 1
                  maximum: 100
                favorite:
                  type:
                    - boolean
                    - 'null'
                  description: 'set_favorite und set_remembered: true an (Favorit / merken), false aus (nicht mehr)'
                weekday:
                  type:
                    - integer
                    - 'null'
                  description: 'add_recurring: Wochentag 1 = Montag … 7 = Sonntag'
                  minimum: 1
                  maximum: 7
                every_weeks:
                  type:
                    - integer
                    - 'null'
                  description: 'add_recurring: alle wie viele Wochen'
                  minimum: 1
                  maximum: 52
          more:
            type:
              - boolean
              - 'null'
            description:
              'Massenbearbeitung: true, wenn noch ungeprüfte Einträge übrig sind (die Karte zeigt
              „Weitere prüfen“)'
    - type: function
      name: draft_recipe
      description: 'Schreibt einen Rezeptentwurf (Text, Links, TikTok, YouTube, Fotos) mit dem
        Artikel-Katalog des Haushalts. Legt nichts an: die App zeigt eine Karte „Prüfen und
        anlegen“.'
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required:
          - wish
          - links
          - page_text
          - page_url
          - refine
          - use_photos
        properties:
          wish:
            type: string
            description: was die Person will, in ihren Worten mit allen Angaben (Portionen, vegetarisch …)
          links:
            type: array
            items:
              type: string
            description: bis zu 3 Links der Person (TikTok, YouTube, Rezeptseiten)
          page_text:
            type:
              - string
              - 'null'
            description:
              'nur wenn ein Link nicht lesbar war: der Rezepttext, den du per Websuche von genau
              dieser Seite gelesen hast'
          page_url:
            type:
              - string
              - 'null'
            description: die Seite zu page_text
          refine:
            type: boolean
            description: 'true: den letzten Entwurf dieses Chats nach dem Wunsch ändern'
          use_photos:
            type: boolean
            description: 'true: die Fotos dieser Nachricht sind die Quelle'
    - type: function
      name: make_image
      description:
        Lässt die App genau ein KI-Foto erzeugen (zum Ansehen, „Als Foto nehmen“ übernimmt es).
        Als letzter Schritt.
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required:
          - prompt
          - for
          - name
        properties:
          prompt:
            type: string
            description: englische Beschreibung des Fotos (ohne Text, ohne Personen)
          for:
            type: string
            enum:
              - recipe
              - restaurant
              - activity
              - draft
            description: wofür das Foto ist
          name:
            type:
              - string
              - 'null'
            description: Titel oder Name des Eintrags; bei draft null
    - type: function
      name: show_images
      description: Zeigt eine Reihe echter Google-Bilder zum Antippen (Quelle bleibt erhalten). Als
        letzter Schritt.
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required:
          - query
          - for
          - name
        properties:
          query:
            type: string
            description: Google-Bildersuche, kurz, ohne Haushaltsdaten
          for:
            type: string
            enum:
              - recipe
              - restaurant
              - activity
              - draft
            description: wofür das Foto ist
          name:
            type:
              - string
              - 'null'
            description: Titel oder Name des Eintrags; bei draft null
    - type: function
      name: show_entities
      description:
        Zeigt eigene Einträge des Haushalts (Rezepte, Sammlungen, Restaurants, Aktivitäten) als
        antippbare Karten. Statt Namen aufzuzählen immer diese Karten. Als letzter Schritt.
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required:
          - title
          - items
        properties:
          title:
            type:
              - string
              - 'null'
            description: kurzer Titel, z. B. „Eure Sammlungen“
          items:
            type: array
            description: höchstens 12 eigene Einträge mit ihrer id aus einem Werkzeug-Ergebnis
            items:
              type: object
              additionalProperties: false
              required:
                - kind
                - id
              properties:
                kind:
                  type: string
                  enum:
                    - recipe
                    - collection
                    - restaurant
                    - activity
                id:
                  type: string
                  description: die id aus dem Werkzeug-Ergebnis
    - type: function
      name: change_recipe
      description: 'Schlägt eine Änderung eines vorhandenen Rezepts vor (z. B. eine vegetarische
        Variante). Ändert nichts: die App zeigt eine Karte, die das Rezept mit „Mit KI ändern“
        öffnet; dort prüft die Person die Änderung und übernimmt sie. Als letzter Schritt.'
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required:
          - id
          - name
          - wish
        properties:
          id:
            type:
              - string
              - 'null'
            description: die id des Rezepts aus einem Werkzeug-Ergebnis
          name:
            type: string
            description: Titel des Rezepts genau wie in den Daten
          wish:
            type: string
            description: die Änderung in den Worten der Person, z. B. „vegetarische Variante“
    - type: function
      name: fill_week
      description:
        Füllt die Woche mit Gerichten des Haushalts nach der Vorschlagslogik der App (Reisen,
        belegte Abende, Abwechslung prüft die App). Du gibst nur die Wünsche; die App zeigt die
        Gerichte als Karte zum Übernehmen. Als letzter Schritt.
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required:
          - from
          - to
          - slot
          - vegetarian
          - quick_days
          - guest_days
          - skip_days
        properties:
          from:
            type: string
            description: erster Tag JJJJ-MM-TT
          to:
            type: string
            description: letzter Tag JJJJ-MM-TT, höchstens 7 Tage
          slot:
            type:
              - string
              - 'null'
            description: Tageszeit des Haushalts; null = die letzte (Abendessen)
          vegetarian:
            type:
              - integer
              - 'null'
            description: mindestens so viele vegetarische Gerichte
            minimum: 0
            maximum: 7
          quick_days:
            type: array
            items:
              type: string
            description: Tage mit wenig Zeit (JJJJ-MM-TT)
          guest_days:
            type: array
            description: Tage mit Gästen
            items:
              type: object
              additionalProperties: false
              required:
                - date
                - count
              properties:
                date:
                  type: string
                  description: JJJJ-MM-TT
                count:
                  type: integer
                  description: wie viele Gäste
                  minimum: 1
                  maximum: 30
          skip_days:
            type: array
            items:
              type: string
            description: Tage, die frei bleiben sollen (JJJJ-MM-TT)
    - type: function
      name: look_at_photos
      description:
        'Zeigt dir die eigenen Fotos von bis zu 6 Einträgen als Bilder, damit du sie bewerten
        kannst. Kostet je Foto: nur, wenn die Person ausdrücklich nach den Fotos fragt.'
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required:
          - kind
          - ids
        properties:
          kind:
            type: string
            enum:
              - recipe
              - restaurant
              - activity
          ids:
            type: array
            items:
              type: string
            description: höchstens 6 ids aus einem Werkzeug-Ergebnis
