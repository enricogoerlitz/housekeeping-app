# The Foundry prompt agent of the KI-Agent (spec 0066, ADR-0019): restaurants and activities in
# one agent, web search (Web IQ) and the client function `show_suggestions` (parsed by core
# ai-agent.ts). Same keys as Foundry's YAML of an agent version (name, description, metadata,
# definition); `instructions_file` is ours: the instructions come from that file next to this one.
# Deployed per environment as places-agent-local / -preview / -prod by `@housekeeping/foundry`.
name: places-agent
description: 'Housekeeping KI-Agent: Restaurants und Aktivitäten mit Websuche (Spec 0066)'
metadata:
  app: housekeeping
  spec: '0066'
instructions_file: places-agent.md
definition:
  kind: prompt
  model: gpt-6.1-terra
  reasoning:
    effort: low
  tools:
    - type: web_search
      search_context_size: medium
    - type: function
      name: show_suggestions
      description: >-
        Zeigt vorgeschlagene Restaurants und Aktivitäten als antippbare Karten in der App an. Als
        letzter Schritt aufrufen.
      strict: true
      parameters:
        type: object
        additionalProperties: false
        required: [title, items, follow_ups]
        properties:
          title:
            type: [string, 'null']
            description: Kurzer Titel der Auswahl, z. B. „Samstag in Kreuzberg“
          items:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                [
                  kind,
                  step,
                  name,
                  category,
                  address,
                  district,
                  lat,
                  lng,
                  price_level,
                  price_range,
                  open_status,
                  why,
                  website,
                  tags,
                ]
              properties:
                kind:
                  type: string
                  enum: [restaurant, activity]
                step:
                  type: [string, 'null']
                  description: „erst“, „dann“ … bei Kombinationen, sonst null
                name:
                  type: string
                  description: Name wie auf der eigenen Website
                category:
                  type: string
                  description: Art, z. B. „Italienisch“, „Gourmetrestaurant“, „Museum“
                address:
                  type: [string, 'null']
                  description: Straße Hausnummer, PLZ Ort – nur aus einer Quelle
                district:
                  type: [string, 'null']
                  description: Stadtteil/Kiez
                lat:
                  type: [number, 'null']
                lng:
                  type: [number, 'null']
                price_level:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 4
                price_range:
                  type: [string, 'null']
                  description: z. B. „40–90 € p. P.“ oder „Eintritt 12 €“
                open_status:
                  type: [string, 'null']
                  description: zum gewünschten Zeitpunkt, z. B. „Fr ab 18 Uhr geöffnet“ oder „unsicher“
                why:
                  type: string
                  description: 1–2 Sätze, warum es zur Anfrage passt
                website:
                  type: [string, 'null']
                  description: Eigene Website (https), nur wenn gefunden
                tags:
                  type: array
                  items:
                    type: string
                  description: z. B. Terrasse, vegetarisch
          follow_ups:
            type: array
            items:
              type: string
            description: Bis zu drei kurze Antworten auf deine Rückfrage, z. B. „Eher mit Terrasse“
