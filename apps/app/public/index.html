    <meta name="theme-color" content="#FAF6EE" media="(prefers-color-scheme: light)" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Housekeeping" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height; with the keyboard open on iOS only as
         high as the visible area (--app-height, spec 0032) */
      #root {
        display: flex;
        height: var(--app-height, 100%);
        flex: 1;
      }
    </style>
    <!-- Spec 0019: the web app handles like an installed app (REQ-001, REQ-008, REQ-009). -->
    <style id="app-feel">
      html {
        background-color: #faf6ee;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #1b1613;
        }
      }
      /* Controls and labels are not selectable; content opts in (Text with selectable). */
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      input,
      textarea,
      [contenteditable='true'] {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
      /* Touch targets reach past what is drawn: 44 pt with a finger, 24 px with a mouse. */
      :is(
        [role='button'],
        [role='link'],
        [role='tab'],
        [role='checkbox'],
        [role='radio'],
        [role='switch'],
        [role='menuitem'],
        [role='menuitemradio'],
        [role='slider'],
        a[href]
      )::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: max(100%, var(--hit, 24px));
        height: max(100%, var(--hit, 24px));
        transform: translate(-50%, -50%);
      }
      @media (pointer: coarse) {
        html {
          --hit: 44px;
        }
      }
      /* Spec 0031, REQ-031: dense cells (the year's days) keep their drawn size; a finger opens
         the month there, so the grown areas never cover the neighbour day. */
      [data-dense]::before {
        display: none;
      }
    </style>
    <script src="/theme-boot.js"></script>
